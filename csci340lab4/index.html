<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cat Facts and Dad Jokes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="py-4">
    <div class="container-fluid">
      <h1>Welcome to the Cat Facts & Dad Jokes Website</h1>
      <h2>Click on one of the buttons to get a fact or joke, have fun!</h2>
    </div>
  </header>

  <main class="container my-4">
    <div class="row g-4">
      <div class="col-md-6">
        <h3>Controls</h3>

        <button id="btnCatFact" class="btn btn-primary mb-2 w-100">
          Get Cat Fact
        </button>

        <button id="btnDadJoke" class="btn btn-success mb-2 w-100">
          Get Dad Joke
        </button>

        <button id="btnClear" class="btn btn-secondary mb-3 w-100">
          Clear Results
        </button>

        <div id="status"></div>
      </div>

      <div class="col-md-6">
        <h3>Results</h3>
        <div id="results"></div>
      </div>
    </div>

    <hr class="my-5">

    <h3>Images</h3>
    <div class="row g-3">
      <div class="col-md-4">
        <img src="images/cat1.jpg" alt="Cat image 1" class="img-fluid">
      </div>
      <div class="col-md-4">
        <img src="images/dad.jpg" alt="Dad image" class="img-fluid">
      </div>
      <div class="col-md-4">
        <img src="images/cat2.jpg" alt="Cat image 2" class="img-fluid">
      </div>
    </div>
  </main>

  <footer class="py-3 mt-5">
    <div class="container-fluid">
      <p>CSCI 340 – Lab 4</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
